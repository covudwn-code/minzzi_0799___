<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MINZZI · 민찌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --pink:#FF6F91;
    --pink-d:#F0577C;
    --pink-soft:#FFA8B8;
    --rose:#FBD4DC;
    --blush:#FCE6EA;
    --cream:#FFF6F4;
    --ink:#4A3038;
    --serif:'Cormorant Garamond',serif;
    --sans:'Pretendard',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);min-height:100vh;color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--rose) 0%, transparent 55%),
      linear-gradient(170deg, var(--blush) 0%, var(--cream) 38%, #FFEFEC 70%, var(--rose) 130%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;padding:0 16px 50px}
  .page{width:100%;max-width:460px;padding-top:28px}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:center;position:relative;height:52px;margin-bottom:10px}
  .topbar .lock{font-size:13px;color:#b79aa0;display:flex;align-items:center;gap:6px;letter-spacing:.3px}

  /* header card */
  .head-card{position:relative;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.7);border-radius:26px;padding:16px 18px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(240,87,124,.12);margin-bottom:14px}
  .head-card .mini{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
    overflow:hidden;border:2px solid #fff;box-shadow:0 4px 12px rgba(240,87,124,.2)}
  .head-card .mini img{width:100%;height:100%;object-fit:cover}
  .head-card h1{font-size:20px;font-weight:800;color:var(--pink-d);letter-spacing:.3px}
  .head-card .share{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
    background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(240,87,124,.18);color:var(--ink);text-decoration:none;transition:.2s}
  .head-card .share:hover{transform:translateY(-50%) scale(1.06)}

  /* profile */
  .profile{text-align:center;padding:14px 0 8px}
  .avatar-wrap{position:relative;width:128px;height:128px;margin:0 auto 14px}
  .avatar{width:128px;height:128px;border-radius:50%;overflow:hidden;border:4px solid #fff;
    box-shadow:0 12px 34px rgba(240,87,124,.28)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .verified{position:absolute;right:6px;bottom:8px;width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#3897F0,#1d6fd0);display:grid;place-items:center;border:3px solid var(--cream);
    box-shadow:0 3px 8px rgba(29,111,208,.4)}
  .verified svg{width:15px;height:15px;fill:#fff}
  .ring{position:absolute;inset:-9px;border-radius:50%;border:1.5px dashed var(--pink-soft);opacity:.7}
  .profile h2{font-size:30px;font-weight:800;color:var(--pink-d);letter-spacing:.5px;line-height:1.1}
  .profile .bio{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--pink);margin-top:8px;line-height:1.35}
  .profile .bio .hb{display:inline-block;animation:beat 1.3s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.18)}40%{transform:scale(1)}}

  /* links */
  .links{margin-top:26px;display:flex;flex-direction:column;gap:15px}

  /* youtube big card */
  .yt{background:#212121;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(33,33,33,.22);
    transition:.25s;text-decoration:none;display:block}
  .yt:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(33,33,33,.3)}
  .yt-top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .yt-logo{display:flex;align-items:center;gap:9px}
  .yt-logo .play{width:38px;height:27px;background:#FF0000;border-radius:7px;display:grid;place-items:center}
  .yt-logo .play::after{content:"";border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #fff;margin-left:2px}
  .yt-logo .word{color:#fff;font-size:23px;font-weight:800;letter-spacing:-.5px}
  .yt-body{display:flex;align-items:center;gap:14px}
  .yt-ava{width:62px;height:62px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #333}
  .yt-ava img{width:100%;height:100%;object-fit:cover}
  .yt-info{flex:1;min-width:0}
  .yt-info .name{color:#fff;font-size:19px;font-weight:700}
  .yt-info .sub{color:#aaa;font-size:13.5px;margin-top:2px}
  .yt-btn{background:#FF0000;color:#fff;font-size:15px;font-weight:700;padding:11px 22px;border-radius:24px;flex:none}

  /* link buttons */
  .lbtn{position:relative;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--pink) 0%,var(--pink-soft) 100%);
    border-radius:20px;padding:21px;color:#fff;font-size:18px;font-weight:700;letter-spacing:.3px;
    text-decoration:none;box-shadow:0 8px 24px rgba(240,87,124,.26);transition:.25s;overflow:hidden}
  .lbtn:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(240,87,124,.34)}
  .lbtn .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
    background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.12)}
  .lbtn .ic svg{width:26px;height:26px}
  .lbtn .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);opacity:.85;font-size:18px}
  .lbtn.ig{background:linear-gradient(135deg,#F58529 0%,#DD2A7B 45%,#8134AF 100%);box-shadow:0 8px 24px rgba(221,42,123,.3)}
  .lbtn.ig:hover{box-shadow:0 14px 34px rgba(221,42,123,.4)}

  /* footer brand */
  .brand{text-align:center;margin-top:34px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--pink-d)}
  .brand .lk{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink-d));
    display:grid;place-items:center;box-shadow:0 6px 16px rgba(240,87,124,.3)}
  .brand .lk svg{width:22px;height:22px;fill:#fff}
  .brand span{font-size:21px;font-weight:800;font-family:var(--serif);font-style:italic}
  .tagline{text-align:center;color:#c79aa4;font-size:12.5px;margin-top:10px;letter-spacing:.5px}
</style>
</head>
